<!doctype html>
<html lang="zh-CN" data-v="5">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101f2c">
  <meta name="description" content="带上罗盘，说出一句话，去看看世界。">
  <link rel="icon" href="../engine/favicon.svg" type="image/svg+xml">
<title>冒险队总部 · 罗盘冒险队</title>
  <!-- A protected host can set window.COMPASS_HQ_CONFIG.mediaBase before the module runs. -->
  <script type="module">
    const v = (await fetch('../engine/VERSION', {cache:'no-store'}).then(r=>r.text()).catch(()=>String(Date.now()))).trim();
    import('../engine/hq.js?v='+encodeURIComponent(v)).catch(()=>{
      let message=document.getElementById('hq-loading');
      if(!message){message=document.createElement('p');message.id='hq-loading';message.className='loading';document.body.replaceChildren(message);}
      message.textContent='总部暂时没打开，请刷新再试一次。';
    });
  </script>
</head>
<body><p id="hq-loading" class="loading">正在打开冒险队总部…</p></body>
</html>
